name: AetherSync CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check
        run: |
          python -m py_compile run_engine.py build_orchestrator.py quantum_accel.py tests/benchmark_harness.py
      - name: Hygiene
        run: |
          test -f LICENSE
          test -f README.md
          test -f .gitignore
          ! find . -type d \( -name node_modules -o -name __pycache__ -o -name target -o -name dist \) | grep .
